name: Image build check

# Validates that the image builds for every pull request (including the ones
# opened by Dependabot). It never logs in and never pushes, so it needs no
# secrets. Mark the `build` job as a required check in the branch ruleset.
# There is intentionally no `paths` filter: a required check that is skipped
# leaves the PR waiting forever.

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Ensure submodule is present
        run: |
          if [ ! -f telegram-bot-api/CMakeLists.txt ]; then
            echo "telegram-bot-api/CMakeLists.txt not found." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
