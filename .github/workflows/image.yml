name: Telegram Bot API Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Containerfile
      - entrypoint.sh
      - telegram-bot-api
      - .gitmodules
      - .github/workflows/image.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: megurobot/telegram-bot-api

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Ensure submodule is present
        run: |
          if [ ! -f telegram-bot-api/CMakeLists.txt ]; then
            echo "Submodule missing, trying to init it..."
            git submodule update --init --recursive
          fi
          if [ ! -f telegram-bot-api/CMakeLists.txt ]; then
            echo "telegram-bot-api/CMakeLists.txt not found." >&2
            echo "Check that .gitmodules exists and the submodule is committed." >&2
            exit 1
          fi

      - name: Get upstream version
        id: version
        run: |
          VERSION=$(sed -nE 's/^project\(TelegramBotApi[[:space:]]+VERSION[[:space:]]+([0-9.]+).*/\1/p' telegram-bot-api/CMakeLists.txt | head -n1)
          if [ -z "${VERSION}" ]; then
            echo "Could not parse the version from telegram-bot-api/CMakeLists.txt" >&2
            grep -in 'project(' telegram-bot-api/CMakeLists.txt >&2 || true
            exit 1
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Parsed version: ${VERSION}"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            docker.io/${{ env.IMAGE }}
            ghcr.io/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
